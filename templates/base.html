<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}{{ site.title }}{% endblock %}</title>
<meta name="description" content="{% block description %}Reformed React evangelist. Now building with Django, htmx, and Claude.{% endblock %}">
<link rel="stylesheet" href="/css/style.css">
<link rel="stylesheet" href="/css/pygments.css">
<link rel="icon" href="/images/favicon.svg" type="image/svg+xml">
</head>
<body>
<header class="site-header">
  <nav>
    <a class="brand" href="/">Kyle Mulleady</a>
    <ul>
      <li><a href="/blog/">Blog</a></li>
      <li><a href="{{ site.github }}">GitHub</a></li>
      <li><a href="mailto:{{ site.email }}">Email</a></li>
    </ul>
  </nav>
</header>
<main>
{% block content %}{% endblock %}
</main>
<footer class="site-footer">
  <p>Hand-written HTML. No JavaScript. Built with a 113-line Python script.</p>
</footer>
</body>
</html>
